name: Request iMessage PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-notify'
        required: true
        type: number

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_JSON=$(gh pr view ${{ inputs.pr_number }} --repo "${{ github.repository }}" --json number,title,url,author)
            NUMBER=$(echo "$PR_JSON" | jq -r '.number')
            TITLE=$(echo "$PR_JSON" | jq -r '.title')
            URL=$(echo "$PR_JSON" | jq -r '.url')
            AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          else
            NUMBER=${{ github.event.pull_request.number }}
            TITLE='${{ github.event.pull_request.title }}'
            URL=${{ github.event.pull_request.html_url }}
            AUTHOR=${{ github.event.pull_request.user.login }}
          fi
          {
            echo "number=$NUMBER"
            echo "title=$TITLE"
            echo "url=$URL"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"

      - name: Register PR with gatekeeper
        run: |
          RESPONSE=$(curl -sS -w "\nHTTP %{http_code}" -X POST "${{ secrets.GATE_SERVER_URL }}/pr/register" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "owner": "${{ github.repository_owner }}",
            "repo": "${{ github.event.repository.name }}",
            "number": ${{ steps.pr.outputs.number }},
            "title": $(jq -Rs . <<< "${{ steps.pr.outputs.title }}"),
            "author": "${{ steps.pr.outputs.author }}",
            "notify_number": "${{ secrets.NOTIFY_NUMBER }}",
            "url": "${{ steps.pr.outputs.url }}"
          }
          EOF
          )
          echo "$RESPONSE"
          echo "$RESPONSE" | tail -1 | grep -q "HTTP 2" || exit 1
